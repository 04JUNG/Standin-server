name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
    paths:
      - ".github/workflows/ci.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "requirements.txt"
      - "api/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "!tests/converter/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall src api scripts

      - name: Run tests
        run: python -m pytest tests/ --ignore=tests/converter -q

      - name: Validate production image
        run: docker build --platform linux/amd64 --tag standin-inference:ci .
