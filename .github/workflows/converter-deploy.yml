name: Deploy converter

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/converter-deploy.yml"
      - ".dockerignore"
      - "Dockerfile.converter"
      - "requirements-converter.txt"
      - "converter/**"
      - "converter_api/**"
      - "config/characters.example.json"
      - "deploy/ecs/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-converter-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: standin/converter

jobs:
  deploy:
    name: Deploy isolated converter
    if: vars.CONVERTER_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'beta' || 'staging' }}
    env:
      # 환경 변수는 job의 environment가 정해진 뒤에만 읽힌다. workflow 레벨에
      # 두면 staging도 repository(프로덕션) 값을 읽을 수 있다.
      ECS_CLUSTER: ${{ vars.CONVERTER_ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.CONVERTER_ECS_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-converter.txt

      - name: Verify deploy and API contracts
        run: |
          python -m pip install --requirement requirements-converter.txt
          python -m pip install httpx pytest
          python -m compileall converter converter_api scripts/measure_converter_latency.py
          python -m pytest -q \
            tests/converter/test_worker_contract.py \
            tests/converter/test_registry.py \
            tests/converter/test_runner_failures.py \
            tests/converter/test_api_contract.py \
            tests/converter/test_deployment_contract.py \
            tests/converter/test_latency_probe.py

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CONVERTER_AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify isolated ECR target exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY"

      - name: Verify optional isolated ECS target exists
        if: env.ECS_SERVICE != ''
        run: |
          test -n "$ECS_CLUSTER"
          STATUS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].status' \
            --output text)
          test "$STATUS" = "ACTIVE"

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push converter image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.converter
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}:latest', steps.ecr.outputs.registry, env.ECR_REPOSITORY) || '' }}
            ${{ github.ref == 'refs/heads/develop' && format('{0}/{1}:develop', steps.ecr.outputs.registry, env.ECR_REPOSITORY) || '' }}
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=converter-deploy-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=converter-deploy-${{ github.ref_name }}

      - name: Download current converter task definition
        if: env.ECS_SERVICE != ''
        run: |
          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          test "$TASK_DEFINITION" != "None"
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION" \
            --query taskDefinition > taskdef.json
          jq -e '.containerDefinitions | any(.name == "converter")' taskdef.json
          jq -e '.containerDefinitions | all(.name != "inference")' taskdef.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        if: env.ECS_SERVICE != ''
        with:
          task-definition: taskdef.json
          container-name: converter
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        if: env.ECS_SERVICE != ''
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
