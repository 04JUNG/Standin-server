name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # 환경별로 나눈다 — staging 배포가 진행 중인 프로덕션 배포를 막지 않는다.
  group: deploy-inference-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: standin/inference

jobs:
  deploy:
    name: Deploy
    if: vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # main만 프로덕션이다. 그 외 브랜치는 전부 staging으로 간다.
    environment: ${{ github.ref == 'refs/heads/main' && 'beta' || 'staging' }}
    env:
      # ⚠ 이 값들은 **job 레벨**에 있어야 한다. 워크플로 레벨 env의 vars는
      #   environment 변수를 보지 못하고 저장소 변수(프로덕션 값)만 읽는다 —
      #   거기 두면 staging 배포가 프로덕션 클러스터로 나간다.
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test
        run: |
          pip install -r requirements.txt pytest
          python -m compileall src api scripts
          python -m pytest tests/ --ignore=tests/converter -q

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # ⚠ 움직이는 태그는 브랜치마다 나눈다 — main은 `latest`, develop은 `develop`.
          #
          # 저장소를 두 환경이 공유하고, 프로덕션 CDK 태스크 정의가 `:latest`를
          # 참조한다. develop 빌드가 `latest`를 옮기면, 그 뒤 누군가 돌린
          # `cdk deploy StandinApp`이 서비스를 CDK 리비전으로 되돌리면서
          # **develop 코드를 프로덕션에 올린다**. SHA 태그는 항상 푸시한다 —
          # 배포는 그쪽을 쓴다. 움직이는 태그는 `cdk deploy`가 서비스를 되돌릴 때
          # 어느 이미지로 수렴할지를 정한다(Standin-infra의 imageTag 컨텍스트).
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}:latest', steps.ecr.outputs.registry, env.ECR_REPOSITORY) || '' }}
            ${{ github.ref == 'refs/heads/develop' && format('{0}/{1}:develop', steps.ecr.outputs.registry, env.ECR_REPOSITORY) || '' }}
          # 로그의 version 필드가 된다. 이미지에 구워야 cdk deploy가 돌아도 남는다.
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download current task definition
        run: |
          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          test "$TASK_DEFINITION" != "None"
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION" \
            --query taskDefinition > taskdef.json

      - name: Verify Human-Art model source
        if: ${{ (vars.POSE_MODEL_VARIANT || 'cascade') == 'cascade' }}
        # 모델 URI는 환경별 assets 버킷을 소유한 CDK/CloudFormation이 task
        # definition에 넣는다. 앱 workflow는 값을 덮어쓰지 않고 존재만 확인한다.
        run: |
          jq -e '
            .containerDefinitions[]
            | select(.name == "inference")
            | [.environment[]?
                | select(.name == "POSE_MODEL_URI" and (.value | length > 0))]
            | length == 1
          ' taskdef.json

      - name: Verify refine thumbnail converter URL
        # /refine preview는 converter 서비스(V3.2.5 FBX 남성 모델 렌더)로 그린다.
        # 주소(Cloud Map/internal ALB)는 POSE_MODEL_URI처럼 infra가 task definition에
        # 넣는다. 없으면 추론 서버가 production에서 기동을 거부하므로 배포 전에 막는다.
        # 옛 마네킹으로 의도적으로 되돌리려면 vars.REFINE_THUMBNAIL_RENDERER=mannequin.
        if: ${{ (vars.REFINE_THUMBNAIL_RENDERER || 'converter') == 'converter' }}
        run: |
          jq -e '
            .containerDefinitions[]
            | select(.name == "inference")
            | [.environment[]?
                | select(.name == "REFINE_THUMBNAIL_CONVERTER_URL" and (.value | length > 0))]
            | length == 1
          ' taskdef.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: taskdef.json
          container-name: inference
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          # 기본은 전체 요청에서 current-X 실패 슬롯에 Human-Art rescue를 적용한다.
          # 긴급 롤백은 environment vars를 POSE_MODEL_VARIANT=current-x,
          # POSE_CANARY_STAGE=off로 바꾼 뒤 workflow_dispatch를 실행한다.
          environment-variables: |
            APP_ENV=production
            POSE_BACKEND=rtmlib
            POSE_MODEL_VARIANT=${{ vars.POSE_MODEL_VARIANT || 'cascade' }}
            POSE_CANARY_STAGE=${{ vars.POSE_CANARY_STAGE || 'canary-100' }}
            POSE_STRICT=1
            REFINE_THUMBNAIL_RENDERER=${{ vars.REFINE_THUMBNAIL_RENDERER || 'converter' }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
