name: Build or deploy scene worker (staging only)
on:
  workflow_call:
    inputs:
      deploy_staging:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      deploy_staging:
        type: boolean
        description: 'Update an already provisioned, dedicated staging worker service'
        default: false
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: scene-worker-staging
  cancel-in-progress: false
jobs:
  staging:
    if: github.ref == 'refs/heads/develop'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ECR_REPOSITORY: standin/scene-worker
      ECS_CLUSTER: ${{ vars.SCENE_ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.SCENE_ECS_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runtime contract tests
        run: |
          pip install -r requirements-converter.txt numpy scipy httpx pytest google-genai opencv-python-headless==5.0.0.93
          python -m pytest -q tests/test_scene_refinement_runtime.py tests/test_scene_worker_deployment.py tests/test_scene_worker_artifact_contract.py tests/converter/test_scene_camera_transport.py tests/test_scene_worker_image_reuse.py tests/test_scene_worker_image.py tests/converter/test_deployment_contract.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SCENE_AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Check dedicated targets before building
        env:
          DEPLOY_STAGING: ${{ inputs.deploy_staging }}
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" > /dev/null
          if [ "$DEPLOY_STAGING" = true ]; then
            test -n "$ECS_CLUSTER"
            test -n "$ECS_SERVICE"
            aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" > /tmp/scene-service.json
            jq -e '.services | length == 1' /tmp/scene-service.json > /dev/null
            jq -e '.services[0] | .status == "ACTIVE" and .desiredCount == 1 and .deploymentConfiguration.maximumPercent == 100 and .deploymentConfiguration.minimumHealthyPercent == 0' /tmp/scene-service.json > /dev/null
            TASK_DEFINITION=$(jq -r '.services[0].taskDefinition' /tmp/scene-service.json)
            aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" --query taskDefinition > /tmp/scene-task.json
            python scripts/validate_scene_task.py /tmp/scene-task.json
          fi
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Check pinned commit image
        id: existing
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" > /tmp/scene-image.json 2> /tmp/scene-image-error; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            case "$(cat /tmp/scene-image-error)" in
              *"(ImageNotFoundException)"*) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
              *) cat /tmp/scene-image-error >&2; exit 1 ;;
            esac
          fi
      - name: Build images from the same commit
        if: steps.existing.outputs.exists != 'true'
        run: |
          docker build --platform linux/amd64 -f Dockerfile.converter -t standin-converter:scene-base .
          docker build --platform linux/amd64 -f Dockerfile.scene-worker -t standin-scene:release .
      - name: Load already published commit image
        if: steps.existing.outputs.exists == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker pull --platform linux/amd64 "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker tag "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" standin-scene:release
      - name: Verify worker image imports
        run: |
          docker run --rm standin-scene:release python -c 'import torch,transformers,rtmlib,onnxruntime,cv2; from src.scene_refinement import runtime,plan; from src.semantic_adapter_285 import excluded_pose_ids; excluded_pose_ids()'
      - name: Push immutable commit tag
        if: steps.existing.outputs.exists != 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag standin-scene:release "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
      - name: Resolve published commit digest
        id: image
        run: python scripts/scene_worker_image.py --commit "$GITHUB_SHA" --require
      - name: Render dedicated task image
        if: inputs.deploy_staging
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/scene-task.json
          container-name: scene-worker
          image: ${{ steps.ecr.outputs.registry }}/standin/scene-worker@${{ steps.image.outputs.digest }}
          environment-variables: |
            DEPLOYMENT_VERSION=${{ github.sha }}
      - name: Update dedicated staging service
        if: inputs.deploy_staging
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
